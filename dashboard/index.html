<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Agent Control</title>
    <link rel="stylesheet" href="/dashboard/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Dashboard navigation">
        <nav class="nav-stack" aria-label="Control-plane sections">
          <button class="nav-button active" data-section="overview" type="button">
            <span>Overview</span>
            <strong id="navCountOverview">0</strong>
          </button>
          <button class="nav-button" data-section="repos" type="button">
            <span>Repos</span>
            <strong id="navCountRepos">0</strong>
          </button>
          <button class="nav-button" data-section="skills" type="button">
            <span>Skills</span>
            <strong id="navCountSkills">0</strong>
          </button>
          <button class="nav-button" data-section="plugins" type="button">
            <span>Plugins</span>
            <strong id="navCountPlugins">0</strong>
          </button>
          <button class="nav-button" data-section="mcp" type="button">
            <span>MCP</span>
            <strong id="navCountMcp">0</strong>
          </button>
          <button class="nav-button" data-section="hooks" type="button">
            <span>Hooks</span>
            <strong id="navCountHooks">0</strong>
          </button>
        </nav>

        <div class="sidebar-footer">
          <span id="lastUpdated">Not loaded</span>
          <button id="refreshButton" class="refresh-button" type="button">Refresh</button>
        </div>
      </aside>

      <main class="main-panel">
        <header class="topbar">
          <div class="section-title">
            <p class="eyebrow" id="sectionEyebrow">Overview</p>
            <h2 id="sectionTitle">Control-plane status</h2>
          </div>
          <label class="search-box">
            <span>Search</span>
            <input id="searchInput" type="search" placeholder="Search names, repos, paths">
          </label>
        </header>

        <section id="metricsGrid" class="metrics-grid" aria-label="Section totals"></section>

        <section id="warningPanel" class="warning-panel hidden" aria-label="Registry warnings">
          <div class="panel-heading">
            <h2>Warnings</h2>
            <span id="warningCount">0</span>
          </div>
          <div id="warningList" class="warning-list"></div>
        </section>

        <section id="filterBar" class="filter-bar" aria-label="Section filters"></section>
        <section id="contentRegion" class="content-region" aria-live="polite"></section>
      </main>
    </div>

    <script src="/dashboard/app.js" defer></script>
  </body>
</html>
