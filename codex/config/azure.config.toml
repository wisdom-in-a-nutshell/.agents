# Spike profile for testing Codex against Azure OpenAI.
# Use with: codex --profile azure

model = "gpt-5.5"
model_provider = "azure"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

[model_providers.azure]
name = "Azure OpenAI"
base_url = "https://aip-openai.openai.azure.com/openai/v1"
wire_api = "responses"

[model_providers.azure.auth]
command = "az"
args = [
  "account",
  "get-access-token",
  "--scope",
  "https://ai.azure.com/.default",
  "--query",
  "accessToken",
  "-o",
  "tsv",
]
timeout_ms = 10000
refresh_interval_ms = 300000
