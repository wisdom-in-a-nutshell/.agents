# API-key profile for Codex against Azure OpenAI.
# Use with: codex --profile azure-key
#
# The key is materialized by the shared machine-secret sync into:
#   ~/.secrets/azure-openai/env

model = "gpt-5.5"
model_provider = "azure-key"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "high"

[model_providers.azure-key]
name = "Azure OpenAI (API Key)"
base_url = "https://aip-openai.openai.azure.com/openai/v1"
env_key = "AZURE_OPENAI_API_KEY"
wire_api = "responses"
