interface:
  display_name: "AI Podcasting"
  short_description: "Submit episodes and update intro copy via API, including local file uploads."
  default_prompt: "Use the ai_podcasting_client to list episodes, submit new episodes, and patch intro/title/thumbnail copy through the app.aipodcast.ing frontend API routes. Use list-episodes with publication-state filters (`published`, `unpublished`, or `all`) and optional start/end dates when the user needs help finding an episode. For intro updates, if source_id is missing, first ask which episode scope to search and any optional dates, then fetch the list and let the user pick one. Send only the fields the user wants to change. If the user gives a local file path, use the aip_local_upload_helper first to get a public URL, then continue. If the user says 'submit' ambiguously, first clarify whether they mean a new main episode submission or an intro update."
