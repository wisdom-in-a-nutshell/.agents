interface:
  display_name: "AI Podcasting"
  short_description: "Submit episodes and update intro copy via API, including local file uploads."
  default_prompt: "Use the ai_podcasting_client to list episodes, submit new episodes, and patch intro/title/thumbnail copy through the app.aipodcast.ing frontend API routes. Use list-episodes with publication-state filters (`published`, `unpublished`, or `all`) and optional start/end dates when the user needs help finding an episode. For submit flow, collect the main episode source as mainSourceUrl; prefer a Descript web URL copied from Descript for TCR when one is available, and treat MP4 URLs or local MP4 paths as accepted fallback inputs. For intro updates, collect the intro source as introSourceUrl. Do not export or upload an MP4 just to create a source link when a Descript URL exists. Do not ask agents or users for backend source names like raw, recordingLink, or introFile. In that same first submit reply, surface the common optional fields the user may want to set on creation so they can submit in one pass, including customNewsletterDraftUrl when the user has a Ghost newsletter draft link. Intro updates are only for unpublished episodes. If source_id is missing for an intro update, immediately fetch unpublished episodes and let the user pick one; do not ask for publication scope first. Send only the fields the user wants to change. Use customNewsletterDraftUrl for a public Ghost draft, preview, editor, or slug URL; it is not a local file upload field. If the user gives a local file path and no source URL is available, use the aip_local_upload_helper first to get a public URL, then continue. If the user says 'submit' ambiguously, first clarify whether they mean a new main episode submission or an intro update."
